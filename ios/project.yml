name: ReadItLater
options:
  bundleIdPrefix: com.isaiahproctor
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '0.2.0'
    CURRENT_PROJECT_VERSION: '3'
    CODE_SIGN_STYLE: Automatic
    APP_GROUP: group.com.isaiahproctor.readitlater
    GENERATE_INFOPLIST_FILE: YES
packages:
  ReadingCore:
    path: ReadingCore
targets:
  ReadItLater:
    type: application
    platform: iOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Read It Later
        ReadingAppGroup: $(APP_GROUP)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSAppTransportSecurity:
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    dependencies:
      - package: ReadingCore
      - target: ReadItLaterShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.isaiahproctor.readitlater
    entitlements:
      path: App/ReadItLater.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
  ReadItLaterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ReadItLater
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.isaiahproctor.readitlater.uitests
        TEST_TARGET_NAME: ReadItLater
  ReadItLaterShare:
    type: app-extension
    platform: iOS
    sources: [ShareExtension, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.isaiahproctor.readitlater.share
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Read It Later
        ReadingAppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    entitlements:
      path: ShareExtension/ReadItLaterShare.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
schemes:
  ReadItLater:
    build:
      targets:
        ReadItLater: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [ReadItLaterUITests]
    archive:
      config: Release
