name: ci

# Validation backstop: every PR, including stacked feature branches, must be green.
# This is what lets an AI agent push a branch and have its work checked
# automatically, independent of whether the agent remembered to run anything.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Next loads env validation during lint as well as build. CI needs no secrets.
    env:
      SKIP_ENV_VALIDATION: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint
        # next lint loads next.config.js and env.js, even though it needs no secrets.
        env:
          SKIP_ENV_VALIDATION: "1"

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Build validates the app compiles. Env-var validation is skipped here so
      # CI doesn't need real secrets; runtime env is validated on the actual
      # Vercel deployment instead.
      - name: Build
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "1"

  native-speech-storage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: speech_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify speech leases, web admission limits, and upgrade preservation
        run: pnpm exec vitest run src/server/services/native-speech/cache.integration.test.ts src/server/services/listening/quota.integration.test.ts src/server/services/listening/migration.integration.test.ts src/server/services/audio-usage/ledger.integration.test.ts src/server/services/audio-usage/legacy-cache.integration.test.ts src/server/services/native-auth/rate-limit.integration.test.ts src/server/services/native-library/service.integration.test.ts src/server/services/native-library/migrations.integration.test.ts src/server/services/native-library/rate-limit.integration.test.ts src/server/services/annotationService.integration.test.ts src/server/services/native-annotations/service.integration.test.ts
        env:
          NATIVE_SPEECH_TEST_DATABASE_URL: postgresql://postgres:password@localhost:5432/speech_test
          LISTENING_TEST_DATABASE_URL: postgresql://postgres:password@localhost:5432/speech_test
          NATIVE_AUTH_TEST_DATABASE_URL: postgresql://postgres:password@localhost:5432/speech_test
          NATIVE_LIBRARY_TEST_DATABASE_URL: postgresql://postgres:password@localhost:5432/speech_test
          ANNOTATION_TEST_DATABASE_URL: postgresql://postgres:password@localhost:5432/speech_test
          NATIVE_ANNOTATION_TEST_DATABASE_URL: postgresql://postgres:password@localhost:5432/speech_test
