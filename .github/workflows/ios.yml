# iOS preview: on-demand build/test check, NOT a PR check.
#
# POLICY: explicit-use only. GitHub Actions macOS minutes are limited.
# Normal iOS validation happens locally on the maintainer's MacBook (Xcode / T3 Code).
# Agents: do NOT trigger, re-run, or add push/pull_request triggers to this
# workflow unless a human explicitly asks. See AGENTS.md "CI / GitHub Actions minutes".

name: iOS preview
on:
  # Manual only: run when a human asks for an on-demand iOS check
  # (e.g. laptop unavailable): gh workflow run "iOS preview" --ref <branch>
  workflow_dispatch:
concurrency:
  group: ios-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Cache ReadingCore Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ios/ReadingCore/.build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: readingcore-${{ runner.os }}-${{ hashFiles('ios/ReadingCore/Package.resolved') }}
          restore-keys: |
            readingcore-${{ runner.os }}-
      - name: Test core
        working-directory: ios/ReadingCore
        run: swift test
      - name: Install project generator
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build iPhone Simulator application and extension
        working-directory: ios
        run: >-
          xcodebuild -project ReadItLater.xcodeproj -scheme ReadItLater
          -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build
      - name: Upload simulator preview
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ReadItLater-0.2-Simulator
          path: ios/DerivedData/Build/Products/Debug-iphonesimulator/ReadItLater.app
      - name: Run reader UI smoke test
        working-directory: ios
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if x["name"].startswith("iPhone")))')
          xcodebuild -project ReadItLater.xcodeproj -scheme ReadItLater \
            -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath DerivedData -resultBundlePath UITestResults.xcresult -parallel-testing-enabled NO \
            -retry-tests-on-failure -test-iterations 2 -test-repetition-relaunch-enabled YES \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test
      - name: Upload UI test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ReadItLater-UI-Test-Results
          path: ios/UITestResults.xcresult
