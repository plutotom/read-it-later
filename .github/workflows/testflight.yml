# Archive Paper Drive and upload it to TestFlight for internal testing.
#
# Signing: archive unsigned (iOS 26 SDK rejects ad-hoc device signing), write
# App Group entitlements into archived-expanded-entitlements.xcent, then let
# xcodebuild -exportArchive cloud-sign both targets with an App Store Connect
# API key (-allowProvisioningUpdates + -authenticationKey*). That uses Xcode's
# cloud-managed Apple Distribution certificate, so this workflow does not
# import a .p12 or provisioning profiles.
#
# Unsigned archives skip Process Product Packaging, so xcent is missing unless
# we stamp it. Without xcent, cloud signing mints a distribution profile
# without application-groups and TestFlight cannot open the App Group.
# Ad-hoc (CODE_SIGN_IDENTITY=-) is not allowed with the iOS 26 device SDK.
#
# Automatic Apple Development signing at archive time would mint a new
# certificate on every ephemeral runner (team cert cap) and needs a registered
# device. Distribution profiles created at export do not.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID      App Store Connect API Key ID
#   ASC_ISSUER_ID   App Store Connect API Issuer ID
#   ASC_KEY_P8      AuthKey_*.p8 PEM, or base64 of that PEM
#
# Do not echo those values. The .p8 is written to $RUNNER_TEMP and deleted.

name: TestFlight

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/testflight.yml"
      - "!ios/**/*.md"
  workflow_dispatch:

concurrency:
  group: testflight-upload
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    name: Archive and upload
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # Last committed CURRENT_PROJECT_VERSION in ios/project.yml was 8.
      # Run 3 computed build 11 but failed before upload, so offset is 7
      # until the next successful run (run 4 → CFBundleVersion 11).
      TESTFLIGHT_BUILD_OFFSET: "7"

    steps:
      - uses: actions/checkout@v4

      - name: Require App Store Connect API secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${ASC_KEY_ID}" ] || missing+=(ASC_KEY_ID)
          [ -n "${ASC_ISSUER_ID}" ] || missing+=(ASC_ISSUER_ID)
          [ -n "${ASC_KEY_P8}" ] || missing+=(ASC_KEY_P8)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required GitHub Actions secrets: ${missing[*]}. Add them under Settings → Secrets and variables → Actions. Create the key at App Store Connect → Users and Access → Integrations → App Store Connect API. See ios/README.md (Internal TestFlight)."
            exit 1
          fi
          echo "App Store Connect API secrets are present."

      - name: Select Xcode accepted by App Store Connect
        run: |
          set -euo pipefail
          # Uploads have required Xcode 26+ / iOS 26 SDK since 2026-04-28.
          # macos-26 currently defaults to 26.6; pick that, else newest 26.x.
          candidate=""
          if [ -d /Applications/Xcode_26.6.app ]; then
            candidate=/Applications/Xcode_26.6.app
          else
            candidate="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          if [ -z "${candidate}" ]; then
            echo "::error::No Xcode 26.x found. App Store Connect requires Xcode 26 or later."
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi
          sudo xcode-select -s "${candidate}"
          echo "Selected ${candidate}"
          xcodebuild -version
          swift --version

      - name: Cache ReadingCore Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ios/ReadingCore/.build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: readingcore-${{ runner.os }}-${{ hashFiles('ios/ReadingCore/Package.resolved') }}
          restore-keys: |
            readingcore-${{ runner.os }}-

      - name: Test ReadingCore
        working-directory: ios/ReadingCore
        run: swift test

      - name: Install XcodeGen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          set +x
          KEY_PATH="${RUNNER_TEMP}/AuthKey.p8"
          export KEY_PATH
          python3 - <<'PY'
          import base64
          import os
          import pathlib
          import sys

          raw = os.environ["ASC_KEY_P8"].strip()
          path = pathlib.Path(os.environ["KEY_PATH"])
          if "BEGIN " in raw:
              text = raw.replace("\r\n", "\n")
              if not text.endswith("\n"):
                  text += "\n"
              path.write_text(text)
          else:
              compact = "".join(raw.split())
              compact += "=" * (-len(compact) % 4)
              try:
                  path.write_bytes(base64.b64decode(compact, validate=True))
              except Exception:
                  sys.stderr.write(
                      "ASC_KEY_P8 is neither a PEM private key nor valid base64.\n"
                  )
                  sys.exit(1)

          contents = path.read_text(errors="replace")
          if "BEGIN " not in contents or "PRIVATE KEY" not in contents:
              sys.stderr.write("ASC_KEY_P8 did not decode to a PEM private key.\n")
              sys.exit(1)
          print(f"Wrote App Store Connect API key ({path.stat().st_size} bytes).")
          PY
          chmod 600 "${KEY_PATH}"
          echo "ASC_KEY_PATH=${KEY_PATH}" >> "${GITHUB_ENV}"

      - name: Compute increasing build number
        run: |
          set -euo pipefail
          build_number=$((TESTFLIGHT_BUILD_OFFSET + GITHUB_RUN_NUMBER))
          echo "BUILD_NUMBER=${build_number}" >> "${GITHUB_ENV}"
          echo "CURRENT_PROJECT_VERSION=${build_number} (offset ${TESTFLIGHT_BUILD_OFFSET} + run ${GITHUB_RUN_NUMBER}). Marketing version stays MARKETING_VERSION from ios/project.yml."

      - name: Archive unsigned device build
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project ReadItLater.xcodeproj \
            -scheme ReadItLater \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "${RUNNER_TEMP}/PaperDrive.xcarchive" \
            -derivedDataPath "${RUNNER_TEMP}/DerivedData" \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Stamp App Group entitlements into the archive
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import plistlib
          import sys

          team = "3CVY7K9AJ6"
          expected_group = "group.com.isaiahproctor.readitlater"
          archive = pathlib.Path(os.environ["RUNNER_TEMP"]) / "PaperDrive.xcarchive"
          apps = list((archive / "Products" / "Applications").glob("*.app"))
          if len(apps) != 1:
              sys.stderr.write(f"Expected one .app in the archive, found {apps!r}\n")
              sys.exit(1)
          app = apps[0]
          appexes = list((app / "PlugIns").glob("*.appex")) if (app / "PlugIns").is_dir() else []
          if not appexes:
              sys.stderr.write(f"No Share Extension .appex under {app / 'PlugIns'}\n")
              sys.exit(1)

          def stamp(bundle: pathlib.Path) -> None:
              info_path = bundle / "Info.plist"
              info = plistlib.loads(info_path.read_bytes())
              bundle_id = info.get("CFBundleIdentifier")
              if not isinstance(bundle_id, str) or not bundle_id or bundle_id.startswith("$("):
                  sys.stderr.write(
                      f"{bundle.name} CFBundleIdentifier is {bundle_id!r}\n"
                  )
                  sys.exit(1)
              info["ReadingAppGroup"] = expected_group
              info_path.write_bytes(plistlib.dumps(info, fmt=plistlib.FMT_BINARY))

              entitlements = {
                  "application-identifier": f"{team}.{bundle_id}",
                  "com.apple.developer.team-identifier": team,
                  "com.apple.security.application-groups": [expected_group],
                  "get-task-allow": False,
              }
              xcent = bundle / "archived-expanded-entitlements.xcent"
              xcent.write_bytes(plistlib.dumps(entitlements, fmt=plistlib.FMT_XML))
              print(f"{bundle.name}: stamped {expected_group} for {bundle_id}")

          for bundle in [app, *appexes]:
              stamp(bundle)
          PY

      - name: Require App Group entitlements in the archive
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import plistlib
          import subprocess
          import sys

          expected = "group.com.isaiahproctor.readitlater"
          archive = pathlib.Path(os.environ["RUNNER_TEMP"]) / "PaperDrive.xcarchive"
          apps = list((archive / "Products" / "Applications").glob("*.app"))
          if len(apps) != 1:
              sys.stderr.write(f"Expected one .app in the archive, found {apps!r}\n")
              sys.exit(1)
          app = apps[0]
          appexes = list((app / "PlugIns").glob("*.appex")) if (app / "PlugIns").is_dir() else []
          if not appexes:
              sys.stderr.write(f"No Share Extension .appex under {app / 'PlugIns'}\n")
              sys.exit(1)

          def fail(message: str) -> None:
              sys.stderr.write(message + "\n")
              sys.exit(1)

          def info_group(bundle: pathlib.Path) -> str:
              info = plistlib.loads((bundle / "Info.plist").read_bytes())
              value = info.get("ReadingAppGroup")
              if not isinstance(value, str) or not value or value.startswith("$("):
                  fail(f"{bundle.name} Info.plist ReadingAppGroup is {value!r}")
              return value

          def entitlement_groups(bundle: pathlib.Path) -> list[str]:
              xcent = bundle / "archived-expanded-entitlements.xcent"
              raw = xcent.read_bytes() if xcent.is_file() else None
              if raw is None:
                  dumped = subprocess.run(
                      ["codesign", "-d", "--entitlements", ":-", str(bundle)],
                      check=False,
                      capture_output=True,
                  )
                  raw = dumped.stdout or dumped.stderr
              if not raw:
                  fail(f"{bundle.name} has no expanded entitlements")
              try:
                  entitlements = plistlib.loads(raw)
              except Exception:
                  start = raw.find(b"<?xml")
                  if start < 0:
                      fail(f"{bundle.name} entitlements are not a plist")
                  entitlements = plistlib.loads(raw[start:])
              groups = entitlements.get("com.apple.security.application-groups") or []
              if not isinstance(groups, list):
                  fail(f"{bundle.name} application-groups is {groups!r}")
              return [item for item in groups if isinstance(item, str)]

          for bundle in [app, *appexes]:
              group = info_group(bundle)
              if group != expected:
                  fail(f"{bundle.name} ReadingAppGroup is {group!r}, expected {expected}")
              groups = entitlement_groups(bundle)
              if expected not in groups:
                  fail(f"{bundle.name} entitlements missing {expected}: {groups!r}")
              print(f"{bundle.name}: App Group {expected} present")
          PY

      - name: Export, cloud-sign, and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "${RUNNER_TEMP}/PaperDrive.xcarchive" \
            -exportOptionsPlist ios/ExportOptions-TestFlight.plist \
            -exportPath "${RUNNER_TEMP}/PaperDrive-export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${ASC_KEY_PATH}" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}"
          echo "Uploaded Paper Drive build ${BUILD_NUMBER} (internal TestFlight only)."

      - name: Delete API key
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${ASC_KEY_PATH:-}" ]; then
            rm -f "${ASC_KEY_PATH}"
            echo "Removed API key file."
          fi
