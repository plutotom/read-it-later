# Archive Paper Drive and upload it to TestFlight for internal testing.
#
# iOS 26's xcodebuild archive rejects ad-hoc device signing, so the archive is
# unsigned. That skips Process Product Packaging: no xcent, and the binary has
# no entitlements. Cloud signing then mints a profile without application-groups
# (TestFlight build 10 and 11). The iOS 26 SDK block is in xcodebuild, not in
# the codesign tool: after the unsigned archive we ad-hoc-sign the .app/.appex
# with --generate-entitlement-der so the signature actually carries
# group.com.isaiahproctor.readitlater, write xcent, export a local IPA, and
# refuse to upload unless the signed IPA and its distribution profile both
# contain that App Group.
#
# Automatic Apple Development signing at archive time would mint a new
# certificate on every ephemeral runner (team cert cap) and needs a registered
# device. Distribution profiles created at export do not.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID      App Store Connect API Key ID
#   ASC_ISSUER_ID   App Store Connect API Issuer ID
#   ASC_KEY_P8      AuthKey_*.p8 PEM, or base64 of that PEM
#
# Do not echo those values. The .p8 is written to $RUNNER_TEMP and deleted.

name: TestFlight

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/testflight.yml"
      - "!ios/**/*.md"
  workflow_dispatch:

concurrency:
  group: testflight-upload
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    name: Archive and upload
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # Last committed CURRENT_PROJECT_VERSION in ios/project.yml was 8.
      # Run 4 uploaded build 11 without App Groups in the signed IPA, so the
      # next run is CFBundleVersion 12 (offset 7 + run 5).
      TESTFLIGHT_BUILD_OFFSET: "7"
      APP_GROUP: group.com.isaiahproctor.readitlater
      APPLE_TEAM_ID: 3CVY7K9AJ6

    steps:
      - uses: actions/checkout@v4

      - name: Require App Store Connect API secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${ASC_KEY_ID}" ] || missing+=(ASC_KEY_ID)
          [ -n "${ASC_ISSUER_ID}" ] || missing+=(ASC_ISSUER_ID)
          [ -n "${ASC_KEY_P8}" ] || missing+=(ASC_KEY_P8)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required GitHub Actions secrets: ${missing[*]}. Add them under Settings → Secrets and variables → Actions. Create the key at App Store Connect → Users and Access → Integrations → App Store Connect API. See ios/README.md (Internal TestFlight)."
            exit 1
          fi
          echo "App Store Connect API secrets are present."

      - name: Select Xcode accepted by App Store Connect
        run: |
          set -euo pipefail
          # Uploads have required Xcode 26+ / iOS 26 SDK since 2026-04-28.
          # macos-26 currently defaults to 26.6; pick that, else newest 26.x.
          candidate=""
          if [ -d /Applications/Xcode_26.6.app ]; then
            candidate=/Applications/Xcode_26.6.app
          else
            candidate="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          if [ -z "${candidate}" ]; then
            echo "::error::No Xcode 26.x found. App Store Connect requires Xcode 26 or later."
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi
          sudo xcode-select -s "${candidate}"
          echo "Selected ${candidate}"
          xcodebuild -version
          swift --version

      - name: Cache ReadingCore Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ios/ReadingCore/.build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: readingcore-${{ runner.os }}-${{ hashFiles('ios/ReadingCore/Package.resolved') }}
          restore-keys: |
            readingcore-${{ runner.os }}-

      - name: Test ReadingCore
        working-directory: ios/ReadingCore
        run: swift test

      - name: Install XcodeGen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          set +x
          KEY_PATH="${RUNNER_TEMP}/AuthKey.p8"
          export KEY_PATH
          python3 - <<'PY'
          import base64
          import os
          import pathlib
          import sys

          raw = os.environ["ASC_KEY_P8"].strip()
          path = pathlib.Path(os.environ["KEY_PATH"])
          if "BEGIN " in raw:
              text = raw.replace("\r\n", "\n")
              if not text.endswith("\n"):
                  text += "\n"
              path.write_text(text)
          else:
              compact = "".join(raw.split())
              compact += "=" * (-len(compact) % 4)
              try:
                  path.write_bytes(base64.b64decode(compact, validate=True))
              except Exception:
                  sys.stderr.write(
                      "ASC_KEY_P8 is neither a PEM private key nor valid base64.\n"
                  )
                  sys.exit(1)

          contents = path.read_text(errors="replace")
          if "BEGIN " not in contents or "PRIVATE KEY" not in contents:
              sys.stderr.write("ASC_KEY_P8 did not decode to a PEM private key.\n")
              sys.exit(1)
          print(f"Wrote App Store Connect API key ({path.stat().st_size} bytes).")
          PY
          chmod 600 "${KEY_PATH}"
          mkdir -p "${HOME}/.appstoreconnect/private_keys"
          cp "${KEY_PATH}" "${HOME}/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "${HOME}/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=${KEY_PATH}" >> "${GITHUB_ENV}"

      - name: Ensure App Groups on App IDs
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import time
          import urllib.error
          import urllib.request

          team = os.environ["APPLE_TEAM_ID"]
          group = os.environ["APP_GROUP"]
          key_path = os.environ["ASC_KEY_PATH"]
          key_id = os.environ["ASC_KEY_ID"]
          issuer = os.environ["ASC_ISSUER_ID"]
          identifiers = [
              "com.isaiahproctor.readitlater",
              "com.isaiahproctor.readitlater.share",
          ]

          def b64url(data: bytes) -> str:
              return base64.urlsafe_b64encode(data).rstrip(b"=").decode()

          def der_to_rs(der: bytes) -> bytes:
              if der[0] != 0x30:
                  raise ValueError("JWT signature is not a DER sequence")
              def take_int(buf, i):
                  if buf[i] != 0x02:
                      raise ValueError("JWT signature is not DER integers")
                  ln = buf[i + 1]
                  i += 2
                  val = buf[i : i + ln]
                  i += ln
                  if val and val[0] == 0:
                      val = val[1:]
                  return int.from_bytes(val, "big"), i
              i = 2
              r, i = take_int(der, i)
              s, i = take_int(der, i)
              return r.to_bytes(32, "big") + s.to_bytes(32, "big")

          now = int(time.time())
          header = json.dumps({"alg": "ES256", "kid": key_id, "typ": "JWT"}, separators=(",", ":"))
          payload = json.dumps(
              {"iss": issuer, "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"},
              separators=(",", ":"),
          )
          signing_input = f"{b64url(header.encode())}.{b64url(payload.encode())}"
          der = subprocess.check_output(
              ["openssl", "dgst", "-sha256", "-sign", key_path],
              input=signing_input.encode(),
          )
          token = signing_input + "." + b64url(der_to_rs(der))

          def api(path, method="GET", body=None):
              req = urllib.request.Request(
                  f"https://api.appstoreconnect.apple.com{path}",
                  data=None if body is None else json.dumps(body).encode(),
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/json",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      raw = resp.read()
                      return resp.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as error:
                  raw = error.read()
                  try:
                      parsed = json.loads(raw) if raw else {}
                  except Exception:
                      parsed = {"raw": raw.decode("replace", "replace")[:500]}
                  return error.code, parsed

          for identifier in identifiers:
              status, payload = api(f"/v1/bundleIds?filter[identifier]={identifier}&include=bundleIdCapabilities")
              if status != 200 or not payload.get("data"):
                  print(f"{identifier}: lookup failed ({status}); archive will try anyway")
                  continue
              bundle = payload["data"][0]
              bundle_id = bundle["id"]
              included = payload.get("included") or []
              capabilities = [
                  item
                  for item in included
                  if item.get("type") == "bundleIdCapabilities"
              ]
              types = [
                  item.get("attributes", {}).get("capabilityType") for item in capabilities
              ]
              print(f"{identifier}: capabilities {types}")
              if "APP_GROUPS" in types:
                  continue
              status, created = api(
                  "/v1/bundleIdCapabilities",
                  method="POST",
                  body={
                      "data": {
                          "type": "bundleIdCapabilities",
                          "attributes": {
                              "capabilityType": "APP_GROUPS",
                              "settings": [
                                  {
                                      "key": "APP_GROUP_IDS",
                                      "options": [{"key": group, "enabled": True}],
                                  }
                              ],
                          },
                          "relationships": {
                              "bundleId": {
                                  "data": {"type": "bundleIds", "id": bundle_id}
                              }
                          },
                      }
                  },
              )
              if status in (200, 201):
                  print(f"{identifier}: enabled APP_GROUPS for {group} (team {team})")
              else:
                  print(f"{identifier}: enable APP_GROUPS returned {status}: {created}")
          PY

      - name: Compute increasing build number
        run: |
          set -euo pipefail
          build_number=$((TESTFLIGHT_BUILD_OFFSET + GITHUB_RUN_NUMBER))
          echo "BUILD_NUMBER=${build_number}" >> "${GITHUB_ENV}"
          echo "CURRENT_PROJECT_VERSION=${build_number} (offset ${TESTFLIGHT_BUILD_OFFSET} + run ${GITHUB_RUN_NUMBER}). Marketing version stays MARKETING_VERSION from ios/project.yml."

      - name: Archive unsigned device build
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project ReadItLater.xcodeproj \
            -scheme ReadItLater \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "${RUNNER_TEMP}/PaperDrive.xcarchive" \
            -derivedDataPath "${RUNNER_TEMP}/DerivedData" \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Ad-hoc sign App Group entitlements into the archive
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import plistlib
          import subprocess
          import sys
          import tempfile

          team = os.environ["APPLE_TEAM_ID"]
          group = os.environ["APP_GROUP"]
          archive = pathlib.Path(os.environ["RUNNER_TEMP"]) / "PaperDrive.xcarchive"
          apps = list((archive / "Products" / "Applications").glob("*.app"))
          if len(apps) != 1:
              sys.stderr.write(f"Expected one .app in the archive, found {apps!r}\n")
              sys.exit(1)
          app = apps[0]
          appexes = list((app / "PlugIns").glob("*.appex")) if (app / "PlugIns").is_dir() else []
          if not appexes:
              sys.stderr.write(f"No Share Extension .appex under {app / 'PlugIns'}\n")
              sys.exit(1)

          def entitlements_for(bundle: pathlib.Path) -> dict:
              info_path = bundle / "Info.plist"
              info = plistlib.loads(info_path.read_bytes())
              bundle_id = info.get("CFBundleIdentifier")
              if not isinstance(bundle_id, str) or not bundle_id or bundle_id.startswith("$("):
                  sys.stderr.write(f"{bundle.name} CFBundleIdentifier is {bundle_id!r}\n")
                  sys.exit(1)
              info["ReadingAppGroup"] = group
              info_path.write_bytes(plistlib.dumps(info, fmt=plistlib.FMT_BINARY))
              return {
                  "application-identifier": f"{team}.{bundle_id}",
                  "com.apple.developer.team-identifier": team,
                  "com.apple.security.application-groups": [group],
                  "get-task-allow": False,
                  "beta-reports-active": True,
              }, bundle_id

          def sign(bundle: pathlib.Path) -> None:
              entitlements, bundle_id = entitlements_for(bundle)
              xcent = bundle / "archived-expanded-entitlements.xcent"
              xcent.write_bytes(plistlib.dumps(entitlements, fmt=plistlib.FMT_XML))
              with tempfile.NamedTemporaryFile(suffix=".plist", delete=False) as handle:
                  path = pathlib.Path(handle.name)
              path.write_bytes(plistlib.dumps(entitlements, fmt=plistlib.FMT_XML))
              try:
                  subprocess.run(
                      [
                          "codesign",
                          "--force",
                          "--sign",
                          "-",
                          "--timestamp=none",
                          "--generate-entitlement-der",
                          "--entitlements",
                          str(path),
                          str(bundle),
                      ],
                      check=True,
                  )
              finally:
                  path.unlink(missing_ok=True)
              print(f"{bundle.name}: ad-hoc signed {group} for {bundle_id}")

          for bundle in [*appexes, app]:
              sign(bundle)
          PY

      - name: Require App Group on signed archive binaries
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import plistlib
          import subprocess
          import sys

          expected = os.environ["APP_GROUP"]
          archive = pathlib.Path(os.environ["RUNNER_TEMP"]) / "PaperDrive.xcarchive"
          apps = list((archive / "Products" / "Applications").glob("*.app"))
          app = apps[0]
          appexes = list((app / "PlugIns").glob("*.appex"))

          def fail(message: str) -> None:
              sys.stderr.write(message + "\n")
              sys.exit(1)

          def groups_from_codesign(bundle: pathlib.Path) -> list[str]:
              dumped = subprocess.run(
                  ["codesign", "-d", "--entitlements", "-", str(bundle)],
                  check=False,
                  capture_output=True,
              )
              raw = dumped.stdout or dumped.stderr
              if not raw:
                  fail(f"{bundle.name} codesign printed no entitlements")
              try:
                  entitlements = plistlib.loads(raw)
              except Exception:
                  start = raw.find(b"<?xml")
                  if start < 0:
                      fail(f"{bundle.name} codesign entitlements are not a plist")
                  entitlements = plistlib.loads(raw[start:])
              groups = entitlements.get("com.apple.security.application-groups") or []
              if not isinstance(groups, list):
                  fail(f"{bundle.name} application-groups is {groups!r}")
              return [item for item in groups if isinstance(item, str)]

          for bundle in [app, *appexes]:
              info = plistlib.loads((bundle / "Info.plist").read_bytes())
              value = info.get("ReadingAppGroup")
              if value != expected:
                  fail(f"{bundle.name} ReadingAppGroup is {value!r}")
              groups = groups_from_codesign(bundle)
              if expected not in groups:
                  fail(f"{bundle.name} signed entitlements missing {expected}: {groups!r}")
              print(f"{bundle.name}: signed App Group {expected} present")
          PY

      - name: Export a local App Store IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA_OPTIONS="${RUNNER_TEMP}/ExportOptions-IPA.plist"
          cp ios/ExportOptions-TestFlight.plist "${IPA_OPTIONS}"
          /usr/libexec/PlistBuddy -c 'Set :destination export' "${IPA_OPTIONS}"
          xcodebuild -exportArchive \
            -archivePath "${RUNNER_TEMP}/PaperDrive.xcarchive" \
            -exportOptionsPlist "${IPA_OPTIONS}" \
            -exportPath "${RUNNER_TEMP}/PaperDrive-export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${ASC_KEY_PATH}" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}"
          ls -la "${RUNNER_TEMP}/PaperDrive-export"

      - name: Require App Group in the signed IPA
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import plistlib
          import shutil
          import subprocess
          import sys
          import tempfile
          import zipfile

          expected = os.environ["APP_GROUP"]
          export_dir = pathlib.Path(os.environ["RUNNER_TEMP"]) / "PaperDrive-export"
          ipas = list(export_dir.glob("*.ipa"))
          if len(ipas) != 1:
              sys.stderr.write(f"Expected one IPA, found {ipas!r}\n")
              sys.exit(1)
          ipa = ipas[0]
          work = pathlib.Path(tempfile.mkdtemp(prefix="paperdrive-ipa-"))
          try:
              with zipfile.ZipFile(ipa) as zipped:
                  zipped.extractall(work)
              apps = list((work / "Payload").glob("*.app"))
              if len(apps) != 1:
                  sys.stderr.write(f"Expected one Payload .app, found {apps!r}\n")
                  sys.exit(1)
              app = apps[0]
              appexes = list((app / "PlugIns").glob("*.appex")) if (app / "PlugIns").is_dir() else []
              if not appexes:
                  sys.stderr.write(f"No Share Extension in IPA under {app}\n")
                  sys.exit(1)

              def fail(message: str) -> None:
                  sys.stderr.write(message + "\n")
                  sys.exit(1)

              def load_plist(raw: bytes):
                  try:
                      return plistlib.loads(raw)
                  except Exception:
                      start = raw.find(b"<?xml")
                      if start < 0:
                          raise
                      return plistlib.loads(raw[start:])

              def codesign_groups(bundle: pathlib.Path) -> list[str]:
                  dumped = subprocess.run(
                      ["codesign", "-d", "--entitlements", "-", str(bundle)],
                      check=False,
                      capture_output=True,
                  )
                  raw = dumped.stdout or dumped.stderr
                  if not raw:
                      fail(f"{bundle.name} IPA codesign printed no entitlements")
                  entitlements = load_plist(raw)
                  groups = entitlements.get("com.apple.security.application-groups") or []
                  if not isinstance(groups, list):
                      fail(f"{bundle.name} IPA application-groups is {groups!r}")
                  return [item for item in groups if isinstance(item, str)]

              def profile_groups(bundle: pathlib.Path) -> list[str]:
                  profile = bundle / "embedded.mobileprovision"
                  if not profile.is_file():
                      fail(f"{bundle.name} IPA is missing embedded.mobileprovision")
                  decoded = subprocess.run(
                      ["security", "cms", "-D", "-i", str(profile)],
                      check=True,
                      capture_output=True,
                  )
                  provision = load_plist(decoded.stdout)
                  entitlements = provision.get("Entitlements") or {}
                  groups = entitlements.get("com.apple.security.application-groups") or []
                  if not isinstance(groups, list):
                      fail(f"{bundle.name} profile application-groups is {groups!r}")
                  return [item for item in groups if isinstance(item, str)]

              for bundle in [app, *appexes]:
                  signed = codesign_groups(bundle)
                  profile = profile_groups(bundle)
                  if expected not in signed:
                      fail(f"{bundle.name} IPA signature missing {expected}: {signed!r}")
                  if expected not in profile:
                      fail(
                          f"{bundle.name} distribution profile missing {expected}: {profile!r}"
                      )
                  print(f"{bundle.name}: IPA App Group {expected} present")
              print(f"Verified {ipa.name}")
          finally:
              shutil.rmtree(work, ignore_errors=True)
          PY

      - name: Upload verified IPA to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          ipa="$(ls "${RUNNER_TEMP}/PaperDrive-export"/*.ipa)"
          xcrun altool --upload-app \
            --type ios \
            --file "${ipa}" \
            --apiKey "${ASC_KEY_ID}" \
            --apiIssuer "${ASC_ISSUER_ID}"
          echo "Uploaded Paper Drive build ${BUILD_NUMBER} (internal TestFlight only)."

      - name: Delete API key
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${ASC_KEY_PATH:-}" ]; then
            rm -f "${ASC_KEY_PATH}"
          fi
          rm -f "${HOME}/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"
          echo "Removed API key files."
